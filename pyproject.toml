[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rbxdsm"
version = "0.1.0"
description = "Migrate Roblox DataStore entries between experiences via the Open Cloud API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
rbxdsm = "rbxdsm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-mock>=3.12", "responses>=0.24"]
